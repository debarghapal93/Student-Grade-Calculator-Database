<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Marks and Grade Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Student Marks and Grade Calculator</h1>
    
    <div id="alertBox" class="alert" style="display: none;"></div>

    <form id="markForm" novalidate>
      <label>Roll No 
        <input type="text" id="roll_no" name="roll_no" maxlength="20" placeholder="e.g. 21CS001" required>
      </label>
      <label>Name 
        <input type="text" id="name" name="name" maxlength="100" placeholder="e.g. John Doe" required>
      </label>
      <label>Class 
        <input type="text" id="class_name" name="class_name" maxlength="50" placeholder="e.g. CSE-A" required>
      </label>
      <label>Web Technology 
        <input class="mark" type="number" id="web_tech" name="web_tech" min="0" max="100" placeholder="0 - 100" required>
      </label>
      <label>Database Management 
        <input class="mark" type="number" id="dbms" name="dbms" min="0" max="100" placeholder="0 - 100" required>
      </label>
      <label>Operating Systems 
        <input class="mark" type="number" id="os" name="os" min="0" max="100" placeholder="0 - 100" required>
      </label>
      <label>Data Structures 
        <input class="mark" type="number" id="data_structures" name="data_structures" min="0" max="100" placeholder="0 - 100" required>
      </label>
      <label>Mathematics 
        <input class="mark" type="number" id="maths" name="maths" min="0" max="100" placeholder="0 - 100" required>
      </label>

      <div class="stats-preview">
        <span>Total: <strong id="total">0</strong> / 500</span>
        <span>Percentage: <strong id="percent">0.00</strong>%</span>
      </div>

      <div class="form-actions">
        <button type="submit" id="submitBtn">Calculate and Save</button>
        <a href="results.html" class="button-link">View Records</a>
      </div>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
